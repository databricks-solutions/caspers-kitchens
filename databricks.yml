  # ─────────────────────────────────────────────────────────────────────────────
  # all — comprehensive DAIS demo: refund + complaints + Operational Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  all:
    resources:
      # Ops SQL warehouse.  DABs is the sole owner of this warehouse so that
      # `bundle deploy -t all` has a stable warehouse id available for the
      # dashboard at deploy time (no chicken-and-egg with task-run-time
      # warehouse creation).  Config matches what `stages/operational_app.ipynb`
      # used to create; the stage was refactored to find-only and uses this
      # warehouse via name lookup.
      sql_warehouses:
        caspers_ops_warehouse:
          name: ${var.catalog}-ops-warehouse
          cluster_size: 2X-Small
          min_num_clusters: 1
          max_num_clusters: 1
          auto_stop_mins: 10
          enable_serverless_compute: true
          warehouse_type: PRO
      # AI/BI dashboards.  Scoped to `all` only because they query schemas
      # that other targets do not build (complaints, food_safety, recommender,
      # lakeflow, ai).  Datasets in each JSON are unqualified (`schema.table`)
      # and `dataset_catalog` injects ${var.catalog} at runtime so the same
      # JSON works in any catalog.  Both dashboards share the ops warehouse.
      dashboards:
        # The Operations dashboard is published in TWO variants — light and
        # dark — because Databricks embedded dashboards always render in
        # "light" mode (the `?theme=` URL param is ignored).  The dark
        # variant bakes dark-palette tokens into the `light` theme slot so
        # the iframe renders with dark colors.  The frontend swaps the
        # iframe src when the user toggles the app theme.
        caspers_ops:
          display_name: "Casper's Kitchen - Operations (${var.catalog})"
          file_path: ./resources/dashboards/caspers_kitchen_operations.lvdash.json
          warehouse_id: ${resources.sql_warehouses.caspers_ops_warehouse.id}
          dataset_catalog: ${var.catalog}
        caspers_ops_dark:
          display_name: "Casper's Kitchen - Operations - Dark (${var.catalog})"
          file_path: ./resources/dashboards/caspers_kitchen_operations_dark.lvdash.json
          warehouse_id: ${resources.sql_warehouses.caspers_ops_warehouse.id}
          dataset_catalog: ${var.catalog}
        caspers_delivery:
          display_name: "Casper's Kitchen - Delivery Performance & SLA (${var.catalog})"
          file_path: ./resources/dashboards/caspers_kitchen_delivery_performance.lvdash.json
          warehouse_id: ${resources.sql_warehouses.caspers_ops_warehouse.id}
          dataset_catalog: ${var.catalog}
        caspers_ai_agent_performance:
          display_name: "Casper's Kitchen - AI Agent Performance (${var.catalog})"
          file_path: ./resources/dashboards/caspers_kitchen_ai_agent_performance.lvdash.json
          warehouse_id: ${resources.sql_warehouses.caspers_ops_warehouse.id}
          dataset_catalog: ${var.catalog}
        caspers_menu_intelligence:
          display_name: "Casper's Kitchen - Menu Intelligence & Nutrition (${var.catalog})"
          file_path: ./resources/dashboards/caspers_kitchen_menu_intelligence.lvdash.json
          warehouse_id: ${resources.sql_warehouses.caspers_ops_warehouse.id}
          dataset_catalog: ${var.catalog}
      jobs:
        caspers:
          name: "Casper's Initializer"
          queue:
            enabled: true
          performance_target: PERFORMANCE_OPTIMIZED

          parameters:
            - name: CATALOG
              default: ${var.catalog}
            - name: EVENTS_VOLUME
              default: events
            # Switched off `databricks-meta-llama-3-3-70b-instruct` because it is
            # the most heavily contended shared FMAPI endpoint in every workspace
            # — agent eval + DSPy CoT bursts + the two `ai_gen()` generator
            # crons + everyone else on the workspace consistently push the
            # shared QPS bucket over its ceiling, surfacing as
            # REQUEST_LIMIT_EXCEEDED (429) during the Refund/Complaint agent
            # tasks even with eval concurrency pinned to 1.  Claude Sonnet 4.5
            # has a separate per-endpoint QPS bucket, equivalent or better
            # tool-use / structured-output quality, and is OpenAI-compatible
            # so DSPy / `ai_gen()` / OpenAI client UDFs all keep working
            # without code changes.  Override at run time with
            # `--params "LLM_MODEL=..."` if you need a specific model.
            - name: LLM_MODEL
              default: databricks-claude-sonnet-4-5
            # Eval is opt-in: it's a quality-measurement burst of ~30-50 LM
            # calls in tight succession and was the dominant 429 source even
            # with eval concurrency pinned to 1.  Deploy / register / endpoint
            # readiness checks only burn ~1-2 calls and run fine.  Flip to
            # "false" when you specifically want to measure agent quality:
            #   databricks bundle run caspers -t all \
            #     --params "CATALOG=oleksandra,SKIP_EVAL=false"
            - name: SKIP_EVAL
              default: "true"
            - name: SIMULATOR_SCHEMA
              default: simulator
            - name: START_DAY
              default: "70"
            - name: SPEED_MULTIPLIER
              default: "60.0"
            - name: SCHEDULE_MINUTES
              default: "3"
            - name: PIPELINE_SCHEDULE_MINUTES
              default: "0"
            # Refund + complaints
            - name: REFUND_AGENT_ENDPOINT_NAME
              default: ${var.catalog}_refund_agent
            - name: COMPLAINT_AGENT_ENDPOINT_NAME
              default: ${var.catalog}_complaint_agent
            - name: COMPLAINT_RATE
              default: "0.15"
            # Operational Dashboard — Knowledge Assistant endpoints are auto-generated
            # by the KA v2.1 API and resolved from uc_state by downstream stages.
            # Operational Dashboard — Multi-Agent Supervisor endpoint (user-supplied)
            - name: SUPERVISOR_ENDPOINT_NAME
              default: ${var.catalog}_operational_supervisor

          tasks:
            # ─── Data foundation ──────────────────────────────────────────────
            - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/canonical_data

            # Shared Lakebase Autoscaling project.  All Lakebase-consuming tasks
            # (Lakebase_Reverse_ETL, Complaint_Lakebase, Operational_Lakebase)
            # depend on this.  Per-component logical databases (caspers_refund,
            # caspers_complaint, caspers_ops) are created by their own stages
            # inside this single project.
            - task_key: Lakebase_Project
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/lakebase_project

            # Small post-ingestion environment-population helpers (seed lookup
            # tables, register helper UDFs, run AI SQL demos on uploaded PDFs,
            # grant demo-user perms, etc.).  Depends on Canonical_Data for the
            # catalog/schemas and on Document_Data for the food_safety PDF
            # volume that the AI SQL cells parse.  Add new helpers inside
            # stages/environment_helpers.ipynb; keep each idempotent.
            - task_key: Environment_Helpers
              depends_on:
                - task_key: Canonical_Data
                - task_key: Document_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/environment_helpers

            - task_key: Spark_Declarative_Pipeline
              depends_on:
                - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/lakeflow

            # ─── Refund recommender ───────────────────────────────────────────
            - task_key: Refund_Recommender_Agent
              depends_on:
                - task_key: Spark_Declarative_Pipeline
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/refunder_agent

            # Refund_Recommender_Stream calls w.jobs.run_now() on the
            # streaming inference job whose UDF queries the Refund agent
            # serving endpoint.  The endpoint must exist and be READY before
            # the stream's first batch fires — without the explicit
            # Refund_Recommender_Agent edge the two tasks race and the
            # stream can hit a missing endpoint.
            - task_key: Refund_Recommender_Stream
              depends_on:
                - task_key: Spark_Declarative_Pipeline
                - task_key: Refund_Recommender_Agent
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/refunder_stream

            - task_key: Lakebase_Reverse_ETL
              depends_on:
                - task_key: Refund_Recommender_Stream
                - task_key: Lakebase_Project
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/lakebase

            - task_key: Databricks_App_Refund_Manager
              depends_on:
                - task_key: Lakebase_Reverse_ETL
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/apps

            # ─── Complaints stream ────────────────────────────────────────────
            - task_key: Complaint_Agent
              depends_on:
                - task_key: Spark_Declarative_Pipeline
                # Serialized AFTER Refund_Recommender_Agent so the two agents do
                # not race on the workspace QPS limit for the shared pay-per-token
                # endpoint `databricks-meta-llama-3-3-70b-instruct` during their
                # MLflow eval steps.  Under the previous parallel layout, the
                # combined in-flight request rate consistently triggered
                # REQUEST_LIMIT_EXCEEDED (429) and the auto-retry hit the same
                # ceiling, failing the whole `all` run.  Adds ~10 min wall-clock
                # but eliminates the rate-limit flake.  See review item P1-9.
                - task_key: Refund_Recommender_Agent
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/complaint_agent

            - task_key: Complaint_Generator_Stream
              depends_on:
                - task_key: Spark_Declarative_Pipeline
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/complaint_generator_stream

            - task_key: Complaint_Agent_Stream
              depends_on:
                - task_key: Complaint_Agent
                - task_key: Complaint_Generator_Stream
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/complaint_agent_stream

            - task_key: Complaint_Lakebase
              depends_on:
                - task_key: Complaint_Agent_Stream
                - task_key: Lakebase_Project
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/complaint_lakebase

            # ─── Operational Dashboard: documents → menu pipeline → genie / KA / MAS / app ───
            - task_key: Document_Data
              max_retries: 0
              depends_on:
                - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/document_data

            - task_key: Menu_Pipeline
              max_retries: 0
              depends_on:
                - task_key: Document_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/menu_pipeline

            - task_key: Genie_Spaces
              max_retries: 0
              depends_on:
                - task_key: Spark_Declarative_Pipeline
                - task_key: Menu_Pipeline
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/genie_spaces

            - task_key: Knowledge_Agents
              max_retries: 0
              depends_on:
                - task_key: Document_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/knowledge_agents

            - task_key: Operational_Lakebase
              max_retries: 0
              depends_on:
                - task_key: Canonical_Data
                - task_key: Lakebase_Project
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/operational_lakebase

            - task_key: Operational_Supervisor
              max_retries: 0
              depends_on:
                - task_key: Genie_Spaces
                - task_key: Knowledge_Agents
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/operational_supervisor

            - task_key: Operational_App
              max_retries: 0
              depends_on:
                - task_key: Operational_Supervisor
                - task_key: Operational_Lakebase
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/operational_app

            - task_key: Readiness_Check
              max_retries: 0
              depends_on:
                - task_key: Operational_App
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/operational_readiness_check

            - task_key: Evaluation
              max_retries: 0
              depends_on:
                - task_key: Readiness_Check
              notebook_task:
                notebook_path: ${workspace.root_path}/demos/operational-dashboard-demo/evaluation
